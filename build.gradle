plugins {
    id 'com.android.application' version '9.2.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.21' apply false
    id 'org.jetbrains.kotlin.kapt' version '2.2.21' apply false
    id 'org.jetbrains.kotlin.plugin.parcelize' version '2.2.21' apply false
    id 'com.google.gms.google-services' version '4.4.4' apply false
    id 'com.google.firebase.crashlytics' version '3.0.7' apply false
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

ext.deps = [:]
def versions = [:]
versions.lifecycle = "2.10.0"
versions.support = "28.0.0"
versions.navigation = "2.9.6"
versions.constraint_layout = "2.2.1"
versions.camerax = "1.6.1"
versions.retrofit = "3.0.0"
versions.stetho = "1.3.1"
versions.dagger = "2.57.2"
versions.archVersion = '1.1.1'
versions.archRoomVersion = '1.1.0'
ext.versions = versions
